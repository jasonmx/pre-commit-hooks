[project]
name = "jasonmx-pre-commit-hooks"
version = "1.0.0"
description = "pre-commit hooks shared by jasonmx's repos"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
check-private = "pre_commit_hooks.check_private:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pre_commit_hooks"]

[tool.ruff]
line-length = 120
target-version = "py312"
